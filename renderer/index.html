<!DOCTYPE html>
<html lang="zh-CN" data-theme="sun" data-market="cn">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <div id="header">
      <span id="title-wrap">
        <span id="market-switch">
          <button type="button" id="market-cn" class="market-btn active">A股</button>
          <span class="market-sep">/</span>
          <button type="button" id="market-us" class="market-btn">美股</button>
          <span class="market-sep">/</span>
          <button type="button" id="market-crypto" class="market-btn">加密</button>
        </span>
        <span id="clock">--:--:--</span>
      </span>
      <span id="header-right">
        <button type="button" id="src-btn" title="数据来源">东财</button>
        <button type="button" id="alert-btn" title="提醒" aria-label="提醒">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.2 9.2a5.8 5.8 0 1 1 11.6 0c0 4.4 1.5 6.4 2.2 7.2H4c.7-.8 2.2-2.8 2.2-7.2z"></path>
            <path d="M10 19.2a2 2 0 0 0 4 0"></path>
          </svg>
          <span id="alert-badge" hidden>0</span>
        </button>
        <button type="button" id="theme-btn">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"></path>
          </svg>
        </button>
        <span id="status">可交互</span>
      </span>
    </div>
    <div id="hint-row">
      <div id="hint">点星关注 · 左键分时 · 右键排序</div>
      <button type="button" id="scale-btn">100% 原始</button>
    </div>
    <div id="viewport">
      <div id="list"></div>
    </div>
    <div id="alert-panel" hidden>
      <div id="alert-head">
        <span>提醒</span>
        <button type="button" id="alert-read-all">全部已读</button>
      </div>
      <div id="alert-list"></div>
    </div>
    <div id="index">
      <div class="row active" id="index-row" data-secid="1.000001">
        <div class="name" id="index-name">
          <span class="name-text">上证指数</span>
          <span class="name-code">000001</span>
        </div>
        <div class="price" id="index-price">--</div>
        <div class="pct flat" id="index-pct">--</div>
      </div>
      <div id="chart-head">
        <span id="chart-title">分时 · 上证指数</span>
        <span id="chart-meta">9:30-15:00</span>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </div>
  <div id="src-menu" hidden>
    <button type="button" data-provider="eastmoney">东方财富</button>
    <button type="button" data-provider="tencent">腾讯财经</button>
    <button type="button" data-provider="sina">新浪财经</button>
  </div>
  <div id="ctx-menu" hidden>
    <button type="button" data-action="top">置顶</button>
    <button type="button" data-action="up">上移</button>
    <button type="button" data-action="down">下移</button>
  </div>
  <div id="hover-tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
