<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #f5c518;
      overflow: hidden;
      font-family: "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #card {
      height: 100%;
      padding: 12px 18px;
      color: #1a1408;
      background: #f5c518;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    #kicker {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(26, 20, 8, 0.7);
    }
    #title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #body {
      font-size: 14px;
      font-weight: 700;
      color: rgba(26, 20, 8, 0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="kicker">关注提醒 · 点这里打开</div>
    <div id="title"></div>
    <div id="body"></div>
  </div>
  <script>
    const titleEl = document.getElementById('title');
    const bodyEl = document.getElementById('body');
    window.stockToast = {
      set(payload) {
        const p = payload || {};
        titleEl.textContent = p.title || '';
        bodyEl.textContent = p.body || '';
      }
    };
    document.getElementById('card').addEventListener('click', () => {
      if (window.toastApi) window.toastApi.click();
    });
  </script>
</body>
</html>
